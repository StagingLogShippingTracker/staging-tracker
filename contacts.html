<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<script>try{var t=localStorage.getItem('swift_theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<title>SLST - Staging Log & Shipping Tracker - Contacts Directory</title>
<meta name="theme-color" content="#D93223" />
<link rel="manifest" href="manifest.webmanifest?v=2" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css?v=10.8" />
</head>
<body>

<div class="wrap">
  <header class="site-header">
    <div class="site-header__start">
      <div class="dropdown">
        <button class="hamburger-btn" onclick="window.toggleMenu(event)">☰</button>
        <div class="dropdown-content">
          <a href="index.html"><b>Index</b> (Dashboard)</a>
          <a href="stage.html" class="indented">↳ Staging Entries Log</a>
          <a href="ship.html" class="indented">↳ Shipped Log</a>
          <a href="reports.html"><b>Reports</b></a>
          <a href="notifications.html"><b>Notifications</b></a>
          <a href="contacts.html"><b>Contacts</b></a>
        </div>
      </div>
    </div>
    <div class="site-header__title-wrap">
      <img src="brand/staging-shipping-logo-transparent.png?v=1" alt="" class="site-header__title-logo" aria-hidden="true" draggable="false" />
      <h1 class="site-header__title">Contacts Directory</h1>
    </div>
    <div class="site-header__end"><div id="authStatus" class="auth-status"></div></div>
  </header>

  <div class="card card--flush">
    <div class="split">
      <h3>Employee Directory</h3>
      <div class="toolbar-row">
        <button class="btn btn-sm btn-purple batch-mode-trigger" onclick="window.open('contacts.html?batch=true', '_self')">Batch Mode</button>
      </div>
    </div>
    <p class="card-desc">Browse, search, and export employee contact information across all branches.</p>

    <div class="search-with-clear" style="margin-bottom: 16px;">
      <input type="text" id="contactSearch" placeholder="Search by name, branch, or designation..." oninput="renderContactsTable()" />
      <button type="button" class="search-clear-btn is-empty" aria-label="Clear search" onclick="window.clearSearchField('contactSearch')">Clear</button>
    </div>

    <div class="tblwrap contacts-table-wrap">
      <div class="tbl-scroller">
        <table id="tblContacts">
          <thead>
            <tr>
              <th class="show-in-batch" style="width:70px; background:#fafafa; padding:4px;"><div class="batch-header-btns"><button onclick="contactBatchSelectAll()" style="font-size:10px; background:#fff; color:#4b5563;">Select All</button><button onclick="contactBatchUnselectAll()" style="font-size:10px; background:#fff; color:#4b5563;">Unselect</button><button onclick="contactBatchExport()" style="font-size:10px; background:#059669; color:#fff; border-color:#059669;">Export</button><button onclick="contactBatchDelete()" style="font-size:10px; background:#dc2626; color:#fff; border-color:#dc2626;">Delete</button><button onclick="contactBatchCancel()" style="font-size:10px; background:#e5e7eb; color:#4b5563; border-color:#cbd5e1;">Cancel</button></div></th>
              <th>Name</th>
              <th>Designation</th>
              <th>Branch</th>
              <th>Email</th>
              <th>Ext.</th>
              <th>Direct</th>
              <th>Mobile</th>
            </tr>
          </thead>
          <tbody>
            <!-- Populated via JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div id="loginModal" class="modal-overlay"><div class="modal-window" style="max-width: 350px;"><button class="modal-close-x" onclick="document.querySelector('#loginModal').style.display='none'">&times;</button><h3 style="margin:0 0 12px 0;">Sign In</h3><div class="modal-field"><label>E-mail <span class="req-mark">*</span></label><input type="email" id="login_email" autocomplete="username" placeholder="warehouse@swiftsupply.ca" /></div><div class="modal-field"><label>Password <span class="req-mark">*</span></label><input type="password" id="login_password" autocomplete="current-password" placeholder="••••••••" /></div><button id="loginBtn" class="btn" style="margin-top:16px; width:100%;" onclick="window.submitLogin()">Sign In</button></div></div>

<!-- Scripts -->
<script src="employees.js?v=3.3"></script>
<script src="config.js?v=4.0"></script>
<script src="auth.js?v=3.4"></script>
<script src="ui.js?v=6.5"></script>
<script src="history.js?v=3.5"></script>
<script src="split.js?v=3.7"></script>
<script src="reports.js?v=3.7"></script>
<script src="operations.js?v=5.0"></script>
<script src="batch.js?v=6.0"></script>
<script src="autoscan.js?v=3.0"></script>
<script src="media.js?v=5.4"></script>
<script src="app.js?v=5.7"></script>

<script>
  // Inject the parsed CSV data
  
  let contactBatchSelected = new Set();
  let contactBatchMode = false;

  function contactBatchCancel() {
    contactBatchMode = false;
    contactBatchSelected.clear();
    document.body.classList.remove('batch-mode');
    if (location.search.includes('batch=true')) {
      history.replaceState({}, '', 'contacts.html');
    }
    renderContactsTable();
  }

  function initContactBatchFromUrl() {
    if (new URLSearchParams(location.search).get('batch') === 'true') {
      contactBatchMode = true;
      document.body.classList.add('batch-mode');
    }
  }

  function toggleContactCheck(idx, isChecked) {
    if (isChecked) contactBatchSelected.add(idx);
    else contactBatchSelected.delete(idx);
  }

  function contactBatchSelectAll() {
    const term = (document.getElementById('contactSearch').value || '').toLowerCase();
    rawContactsData.forEach((c, idx) => {
      const match = c.name.toLowerCase().includes(term) || c.branch.toLowerCase().includes(term) || c.designation.toLowerCase().includes(term);
      if (match) contactBatchSelected.add(idx);
    });
    renderContactsTable();
  }

  function contactBatchUnselectAll() {
    contactBatchSelected.clear();
    renderContactsTable();
  }

  function contactBatchDelete() {
    if (contactBatchSelected.size === 0) return alert("Select at least one contact to delete.");
    if (!confirm(`Are you sure you want to remove ${contactBatchSelected.size} selected contacts?`)) return;
    
    // Convert Set to Array and sort descending so splicing doesn't mess up indices
    const indicesToRemove = Array.from(contactBatchSelected).sort((a,b) => b - a);
    indicesToRemove.forEach(idx => {
      rawContactsData.splice(idx, 1);
    });
    
    contactBatchSelected.clear();
    renderContactsTable();
    if(typeof window.showNotification === 'function') window.showNotification('Contacts Deleted');
  }

  function contactBatchExport() {
    if (contactBatchSelected.size === 0) return alert("Select at least one contact to export.");
    
    const indices = Array.from(contactBatchSelected).sort((a,b) => a - b);
    let csvContent = "Name,Designation,Branch,Email,Ext,Direct,Mobile\n";
    
    indices.forEach(idx => {
      const c = rawContactsData[idx];
      const row = `"${c.name}","${c.designation}","${c.branch}","${c.email}","${c.ext}","${c.direct}","${c.mobile}"`;
      csvContent += row + "\n";
    });

    const blob = new Blob([csvContent], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = "Swift_Contacts_Export.csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    
    if(typeof window.showNotification === 'function') window.showNotification('Contacts Exported');
    contactBatchCancel();
  }

  function renderContactsTable() {
    const tbody = document.querySelector('#tblContacts tbody');
    if(!tbody) return;
    
    const term = (document.getElementById('contactSearch').value || '').toLowerCase();
    let html = '';

    rawContactsData.forEach((c, idx) => {
      const match = c.name.toLowerCase().includes(term) || c.branch.toLowerCase().includes(term) || c.designation.toLowerCase().includes(term);
      if(!match) return;

      const checked = contactBatchSelected.has(idx) ? 'checked' : '';
      
      html += `
        <tr>
          <td class="show-in-batch" style="text-align:center;">
            <input type="checkbox" class="batch-checkbox" ${checked} onchange="toggleContactCheck(${idx}, this.checked)" />
          </td>
          <td class="contact-name-cell">${c.name}</td>
          <td style="color:#475569;">${c.designation}</td>
          <td><span class="branch-badge">${c.branch}</span></td>
          <td>${c.email ? `<a href="mailto:${c.email}" class="contact-email-link">${c.email}</a>` : '—'}</td>
          <td>${c.ext}</td>
          <td>${c.direct}</td>
          <td>${c.mobile}</td>
        </tr>
      `;
    });

    if(html === '') html = '<tr><td colspan="8" style="text-align:center; padding:20px; color:#64748b;">No contacts found matching your search.</td></tr>';
    tbody.innerHTML = html;
  }

  // Initial render when DOM is ready
  document.addEventListener('DOMContentLoaded', () => {
    initContactBatchFromUrl();
    renderContactsTable();
  });
</script>
</body>
</html>
