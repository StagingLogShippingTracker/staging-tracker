name: Build Swift Staging Log

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package portable ZIP
        shell: pwsh
        run: |
          $release = "build\windows\x64\runner\Release"
          $dist = "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $artifact = "$dist\SwiftStagingLog-Windows-Portable.zip"
          Compress-Archive -Path "$release\*" -DestinationPath $artifact -Force
          $hash = (Get-FileHash -Algorithm SHA256 -Path $artifact).Hash.ToLowerInvariant()
          Set-Content -Path "$artifact.sha256" -Value "$hash *SwiftStagingLog-Windows-Portable.zip" -NoNewline
      - uses: actions/upload-artifact@v4
        with:
          name: SwiftStagingLog-Windows-Portable
          path: dist/SwiftStagingLog-Windows-Portable.zip*

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build APK
        run: |
          if [ -f android/key.properties ]; then
            flutter build apk --release
            mkdir -p dist
            cp build/app/outputs/flutter-apk/app-release.apk dist/SwiftStagingLog-Android.apk
          else
            flutter build apk --debug
            mkdir -p dist
            cp build/app/outputs/flutter-apk/app-debug.apk dist/SwiftStagingLog-Android.apk
          fi
          sha256sum dist/SwiftStagingLog-Android.apk > dist/SwiftStagingLog-Android.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: SwiftStagingLog-Android
          path: dist/SwiftStagingLog-Android.apk*
