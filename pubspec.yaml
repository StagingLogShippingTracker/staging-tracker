name: swift_staging_log
description: Swift Staging & Shipping Log — Flutter Windows/Android client (shared domain in packages/swift_staging_shared; Wear in apps/wear).
publish_to: 'none'
version: 1.1.45+48

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.9.1
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  file_picker: ^10.1.9
  path: ^1.9.1
  intl: ^0.20.2
  uuid: ^4.5.1
  collection: ^1.19.1
  url_launcher: ^6.3.1
  http: ^1.4.0
  image: ^4.8.0
  package_info_plus: ^8.3.0
  flutter_ocr_native:
    path: third_party/flutter_ocr_native
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  google_fonts: ^6.2.1
  audioplayers: ^6.5.1
  swift_staging_shared:
    path: packages/swift_staging_shared

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/contacts.json
    - assets/swift-staging-log-app-icon.png
    - assets/swift-staging-log-mark-s.png
    - assets/swift-staging-log-wordmark-white.png
    - assets/branding/swift_supply_logo_orange_solid.png
    - assets/success_chime.wav
    - assets/swift-document-generator-icon.png